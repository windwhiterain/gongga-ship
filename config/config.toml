[tool_text.python]
description = '''`bash` with Python instead of a shell, on this machine. Everything `bash` says about `name`, `description` and `timeout_ms` holds here unchanged; `code` takes the place of `command`, and `restart` stops this name's interpreter so the call starts a fresh namespace. State survives between calls to one name because it is one process, so write ordinary Python -- there is no shell quoting to escape. Standard output and standard error come back; an exception comes back as a traceback and the namespace keeps what it had reached.'''

[tool_text.python.arguments]
background = '''Start the call and return at once: it is a job of this interpreter, `check_python` collects what it printed, and this session is told when it ends. It ends with the server, unlike a `background` call that is a process of its own.'''
code = '''Python source to execute in the named interpreter. A single expression is evaluated and its repr printed; otherwise the block is executed.'''
description = '''What this call is for, in a few words -- read after the tool name, never executed.'''
name = '''Which interpreter this call is about. Omitted means `default`; a new name starts a fresh interpreter in the session's working directory.'''
restart = '''Stop this name's current interpreter and start a fresh one for this call, discarding its namespace.'''
timeout_ms = '''How long to wait for this call. On timeout the interpreter is stopped and the next call to that name starts with a fresh namespace.'''

[tool_text.remote_python]
description = '''`python` on the session's remote endpoint, exactly as `remote_bash` is `bash`: same `code`, `name`, `description`, `timeout_ms`, `background` and `restart`; the paths are that machine's.'''

[tool_text.remote_python.arguments]
