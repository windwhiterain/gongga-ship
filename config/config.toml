# gongga server configuration -- the shipped default.
#
# Installed by the harness into a home from the pinned ship commit, and merged
# with whatever the reader edited there: this file is copied as it is, so no
# placeholder is filled in on the way. The connection key lives beside it in
# `server.key`, never here, which is what lets this file be a merge target.
#
# Every value can be overridden by a GONGGA_* environment variable, and a value
# left out falls back to the same default the loader uses.

[server]
bind = "127.0.0.1:9700"
# The database is `<home>/gongga.db` and there is no key for it: a home that could
# name its database elsewhere could also name somebody else's.

[model]
# Which model to talk to. These are left commented out on purpose:
# the roster at ~/.agents/providers.toml already says what this machine can
# reach, and the first entry that works is a better default than a
# name frozen into this file. Uncomment to override it.
# `model_name` is the name the provider's API takes; `provider` is whose it
# is, and may be left out when only one provider carries that name.
# model_name = ""
# provider = "deepseek-official"
# base_url = ""
# api_key_env = ""
# Capabilities are NOT configured here: they belong to the model, so
# they come from its entry in the roster (~/.agents/providers.toml):
#
#   [[provider.model]]
#   id = "some-model"
#   # What it takes in and gives back. A list without "image" makes
#   # an attachment be refused by this entry's name instead of letting the
#   # provider answer with an opaque 400. Omit the list and nothing is
#   # refused: unstated is not a no.
#   modalities = ["text", "image"]
#   # Tools the provider runs on its own side, spelled the way that
#   # provider spells them -- "web_search", "web_search_preview",
#   # "web_fetch", ... Sent verbatim, so no mapping table is needed.
#   # Omit it and none are offered: offering one a provider does not
#   # know fails every request of every turn.
#   builtin_tools = ["web_search"]
store = false
# A request that never answers used to park a turn forever. Two
# timers bound it, each knowing what it bounds: the answer's
# headers must arrive within this long, and the model may not go
# this long without saying anything -- keep-alive chunks carry no
# event and do not count. Nothing bounds the body's total time: a
# long answer is allowed to take as long as it takes.
headers_timeout_ms = 180000
idle_timeout_ms = 60000
# Retries after a failure, a timeout, or a response with nothing in
# it. 0 = no ceiling: retry until the turn is cancelled. The delay
# doubles each time up to 30s: 1000ms, then twice that.
max_retries = 0
retry_base_ms = 1000

[tools.bash]
timeout_ms = 120000
# Output longer than this is capped: head and tail come back, the
# whole thing lands in ~/.gongga/outputs/. 0 disables the cap.
max_output_chars = 8000

[scripts]
# Commands a Python script registers with this server, without a Rust
# change: every *.py here is asked for its manifest, and what it
# declares appears in the catalog like any other command.
# dir = "scripts"
# Interpreter. Commented out: one that answers `-V` is detected.
# program = "/usr/bin/python3"

[agent]
# No step limit: a turn runs until the work is done.
# This server does not shorten the transcript for you. When a request carries
# more than this many input tokens, it injects one message telling the
# agent so, and the agent acts with the script the `heir` skill ships:
# hand the whole transcript to a mentor session and empty itself.
# 0 disables the
# notice. Only used when the model's context window is not in the
# roster; otherwise the threshold is a share of the window.
compress_above_tokens = 40000

[transport]
mtu = 1200
window = 64

# ---------------------------------------------------------------- prompts
#
# Every word this server hands a model as prose -- the system instructions and
# the few notes it injects -- lives here as a string template. Nothing in the
# binary composes those sentences: they are read from the home's `config.toml`
# when one exists and from this file otherwise.
#
# `{{name}}` is substituted; a placeholder the server does not supply is left
# exactly as written, so a typo shows up in what the model reads instead of
# silently deleting a sentence. The names each template gets are listed above
# it.
#
# These are re-read when a prompt row is written -- the turn's first step, or
# the step after a handover note moved -- and the text rendered then is stored
# in that row and sent from it, so an edit lands at a boundary rather than at
# every step. Prose sits in front of the whole transcript in the provider's
# cached prefix: re-rendering per step re-bills the history behind it once per
# edit, and storing the render says what the model was actually told.
#
# What a template can never do is rewrite history: the rows of a session
# already under way are replayed as stored. Changing what a session remembers
# is the agent's own act, from a shell -- handing the transcript to a mentor
# and clearing itself with `heir`.
[prompts]

# The system instructions, sent as `instructions` on every request. One
# placeholder, `{{session}}`: the name is the one thing that differs between two
# sessions reading the same prose, and it is what makes `get_messages`,
# `send_message` and a handover addressable without guessing.
instructions = '''
You are session `{{session}}`, a coding agent running on the user's machine.

You have a persistent bash shell, and it keeps its working directory and environment between calls. The first call already starts in the session's working directory, which is where the project is: `pwd`, then relative paths.

Read with intent, in batches and cascades. Issue independent read-only tool calls together in one response instead of waiting for each result before writing the next. Within one bash call, group related reads under labelled echoes: `echo == a; sed -n '1,80p' src/cmark/block.mbt; echo == b; grep -n "fn atx_heading" -A 40 src/cmark/block_struct.mbt`. When a later command depends on an earlier one, cascade them with `&&` so a failed prerequisite stops the chain: `moon fmt src/cmark/block_struct.mbt && moon test && git diff --check`. A call that returns a little more than you need is cheaper than three that return exactly what you asked, and a region already read is not read again -- if it was cut off, read it wider next time. The same holds for a check: one command that proves the change, not four that restate it.

Start from the suite, not from the module. Run it once, keep the failing names, and read the code those names point at: they say which behaviour is missing, and the suite is the oracle, so re-reading tests instead of running them is the expensive way to learn what they already say. Then draft early. A first attempt that fails ten tests teaches you more than twenty more reads do, and each run costs a second. Say what you are about to do in one sentence, then do it. When a command fails, read the error before retrying. When the suite is green and the work is committed, the task is done: say what changed and stop.

Do not ask for confirmation; the user has already authorised bash execution. Do not go looking outside the project for the code you are asked to write: this machine is not the source, and there is no network. Leave nothing behind -- no scratch files in the tree, no probe tests, no background processes.

You drive the server from your bash with `gongga-cli <command> --<arg> <value>`: `gongga-cli` alone lists what this one publishes, `gongga-cli get_messages --session main --range -5:` reads a transcript back, and `gongga-cli cancel` stops the running turn while keeping it pending for the next server -- prefer it to killing processes. A command prints one JSON event per line and its `cmd_result` last, so `| jq` and `| grep` take only the part you asked for. `gongga-cli` is on your `PATH` -- in a script too, `subprocess.run(["gongga-cli", ...])` starts the same program -- `$GONGGA_SESSION` is the session you are running, and `$GONGGA_SERVER` and `$GONGGA_HOME` are in your environment.

Skills are prose that teaches a procedure this server does not encode as a tool. Ask `index_skill` for the table -- name, description, path, bucket -- and read a body only when its description matches the task in front of you: the table is the cheap step, the body the expensive one. A skill may ship a script next to it, so run that instead of retyping the commands it encodes. Three buckets, and the first one is the nearest: the project a session is working in owns `<session cwd>/.agents/skills/<name>`, this home owns `$GONGGA_HOME/skills/<name>`, and the machine owns `~/.agents/skills/<name>`. A name in more than one is the first one -- a checkout that says "here, do it this way" outranks the home it sits in.
'''

# What introduces a handover note when a session replays one.
# Placeholders: {{handover}}
handover_preamble = '''
Your mentor prepared this first lesson for you, the heir. Continue the current work from it:

{{handover}}'''

# What the agent is told when a request gets big: begin training immediately;
# unfinished work and a dirty tree are current state, not prerequisites to fix.
# Placeholders: {{session}}, {{tokens}}, {{budget}}
context_notice = '''
Context notice for `{{session}}`: {{tokens}} input tokens against a threshold of {{budget}}. Start training your heir now. The heir continues the current work; do not finish the task, commit, clean the tree, or make the tests pass first.

A mentor is a session that keeps this transcript and can answer later questions. Your `--note` is the heir's first lesson: the current objective, what was tried, what worked or failed, the current state, and the next action.

Ask `index_skill` for `heir`; `<heir>` below is the path it prints. Then run this command now:

<heir>/transcript heir --session {{session}} --mentor <name> --note '<objective, tried, worked, failed, current state, next action>'

Uncommitted changes and failing tests are valid state: record them instead of fixing them first. Every request made before the heir starts is paid for at this size.'''

# What the agent is told about a tool call that never returned: verify, do not
# assume. Static.
interrupted_call = '''
No result was recorded: the turn was interrupted before this call returned. Its outcome is unknown -- re-check before relying on it.'''

# The one instruction a provider's size refusal leaves out: how to make it fit.
# Placeholders: {{message}}
size_hint = '''
{{message}}

The transcript no longer fits this model. Start training an heir now with `heir`'s `transcript heir` (`index_skill` prints its path). The heir continues the current work; no commit, clean tree, or green suite is required first.'''

# Why an image cannot be sent to this model, in the roster's own words.
# Placeholders: {{model}}, {{modalities}}
image_refusal = '''
this model cannot look at images: the roster lists modalities = [{{modalities}}] for {{model}}, with no "image" in it. Use a model whose roster entry includes "image" (set_session --model <provider>/<model name>), or leave the image out.'''

# Spliced into capped tool output where the middle was cut, naming the file the
# whole thing was written to. Placeholders: {{omitted}}, {{total}}, {{path}}
# The value opens with the two line breaks the model sees: TOML trims only the
# newline right after the delimiter, so two empty lines stay in the text.
output_cap = '''


[... {{omitted}} characters omitted ...]
full output ({{total}} characters) written to {{path}}
read just the part you need: `sed -n 'START,ENDp' {{path}}` or `grep -n PATTERN {{path}}` -- do not cat the whole thing again'''

# The same cut when nothing could be spilled to disk. Placeholder: {{omitted}}
output_omitted = '''


[... {{omitted}} characters omitted ...]'''
