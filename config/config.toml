# gongga server configuration -- the shipped default.
#
# Installed by the harness into a home from the pinned ship commit, and merged
# with whatever the reader edited there: this file is copied as it is, so no
# placeholder is filled in on the way. The connection key lives beside it in
# `server.key`, never here, which is what lets this file be a merge target.
#
# Every value can be overridden by a GONGGA_* environment variable, and a value
# left out falls back to the same default the loader uses.

[server]
bind = "127.0.0.1:9700"
# One database per home; omit it to keep the file beside the home,
# where a relative path cannot follow the cwd instead.
# db = "gongga.db"

[llm]
# Which provider to talk to. These are left commented out on purpose:
# the roster at ~/.agents/llm.toml already says what this machine can
# reach, and the first entry that works is a better default than a
# name frozen into this file. Uncomment to override it.
# provider = "deepseek-official"
# model = ""
# base_url = ""
# api_key_env = ""
# Capabilities are NOT configured here: they belong to the model, so
# they come from its entry in the roster (~/.agents/llm.toml):
#
#   [[provider.model]]
#   id = "some-model"
#   # What it takes in and gives back. A list without "image" makes
#   # an attachment be refused by this entry's name instead of letting the
#   # provider answer with an opaque 400. Omit the list and nothing is
#   # refused: unstated is not a no.
#   modalities = ["text", "image"]
#   # Tools the provider runs on its own side, spelled the way that
#   # provider spells them -- "web_search", "web_search_preview",
#   # "web_fetch", ... Sent verbatim, so no mapping table is needed.
#   # Omit it and none are offered: offering one a provider does not
#   # know fails every request of every turn.
#   builtin_tools = ["web_search"]
store = false
# A request that never answers used to park a turn forever. These
# bound it: one request may take this long overall, and this long
# between chunks, before it counts as broken and is retried.
request_timeout_ms = 180000
idle_timeout_ms = 60000
# Retries after a failure, a timeout, or a response with nothing in
# it. 0 = no ceiling: retry until the turn is cancelled. The delay
# doubles each time up to 30s: 1000ms, then twice that.
max_retries = 0
retry_base_ms = 1000

[tools.bash]
timeout_ms = 120000
# Output longer than this is capped: head and tail come back, the
# whole thing lands in ~/.gongga/outputs/. 0 disables the cap.
max_output_chars = 8000

[scripts]
# Commands a Python script registers with this server, without a Rust
# change: every *.py here is asked for its manifest, and what it
# declares appears in the catalog like any other command.
# dir = "scripts"
# Interpreter. Commented out: one that answers `-V` is detected.
# program = "/usr/bin/python3"

[agent]
# No step limit: a turn runs until the work is done.
# This server does not compact the transcript. When a request carries
# more than this many input tokens, it injects one message telling the
# agent so, and the agent acts with the script the `heir` skill ships:
# either fold the older part into a note, or hand the whole transcript
# to a mentor session and empty itself.
# 0 disables the
# notice. Only used when the model's context window is not in the
# roster; otherwise the threshold is a share of the window.
compress_above_tokens = 40000

[transport]
mtu = 1200
window = 64

# ---------------------------------------------------------------- prompts
#
# Every word this server hands a model as prose -- the system instructions and
# the few notes it injects -- lives here as a string template. Nothing in the
# binary composes those sentences: they are read from the home's `config.toml`
# when one exists and from this file otherwise.
#
# `{{name}}` is substituted; a placeholder the server does not supply is left
# exactly as written, so a typo shows up in what the model reads instead of
# silently deleting a sentence. The names each template gets are listed above
# it.
#
# These are re-read when a prompt row is written -- the turn's first step, or
# the step after a handover note moved -- and the text rendered then is stored
# in that row and sent from it, so an edit lands at a boundary rather than at
# every step. Prose sits in front of the whole transcript in the provider's
# cached prefix: re-rendering per step re-bills the history behind it once per
# edit, and storing the render says what the model was actually told.
#
# What a template can never do is rewrite history: the rows of a session
# already under way are replayed as stored. Changing what a session remembers
# is the agent's own act, from a shell -- folding rows out with `collapse`, or
# handing the transcript to a mentor and clearing itself with `heir`.
[prompts]

# The system instructions, sent as `instructions` on every request. Static text:
# no placeholders, since it describes this harness rather than one turn.
instructions = '''
You are gongga, a coding agent running on the user's machine.

You have a persistent bash shell, and it keeps its working directory and environment between calls. The first call already starts in the session's working directory, which is where the project is: `pwd`, then relative paths.

Read with intent, and in batches. One call can carry several reads: `echo == a; sed -n '1,80p' src/cmark/block.mbt; echo == b; grep -n "fn atx_heading" -A 40 src/cmark/block_struct.mbt`. A call that returns a little more than you need is cheaper than three that return exactly what you asked, and a region already read is not read again -- if it was cut off, read it wider next time. The same holds for a check: one command that proves the change, not four that restate it.

Start from the suite, not from the module. Run it once, keep the failing names, and read the code those names point at: they say which behaviour is missing, and the suite is the oracle, so re-reading tests instead of running them is the expensive way to learn what they already say. Then draft early. A first attempt that fails ten tests teaches you more than twenty more reads do, and each run costs a second. Say what you are about to do in one sentence, then do it. When a command fails, read the error before retrying. When the suite is green and the work is committed, the task is done: say what changed and stop.

Do not ask for confirmation; the user has already authorised bash execution. Do not go looking outside the project for the code you are asked to write: this machine is not the source, and there is no network. Leave nothing behind -- no scratch files in the tree, no probe tests, no background processes.

You drive the server from your bash with `gongga <command> --<arg> <value>`: `gongga` alone lists what this one publishes, `gongga get_messages --session main --range -5:` reads a transcript back, and `gongga cancel` stops the running turn while keeping it pending for the next server -- prefer it to killing processes. A command prints one JSON event per line and its `cmd_result` last, so `| jq` and `| grep` take only the part you asked for. `gongga` is on your `PATH`, `$GONGGA_SESSION` is the session you are running, and `$GONGGA_CLI`, `$GONGGA_SERVER` and `$GONGGA_HOME` are in your environment for the scripts you run.

Replacing the server you are running on belongs to the `evolve` skill, `$GONGGA_HOME/skills/evolve/SKILL.md`: do it only after changing the server itself, and let its script decide when a swap is safe. Do not write a handoff note before one -- the resume replays the transcript, so a note adds nothing; what has to be re-measured is the outside world, the pid, the port, the pending rows.

Skills are prose that teaches a procedure this server does not encode as a tool. Ask `index_skill` for the table -- name, description, path, bucket -- and read a body only when its description matches the task in front of you: the table is the cheap step, the body the expensive one. A skill may ship a script next to it, so run that instead of retyping the commands it encodes. The harness bucket is installed at `$GONGGA_HOME/skills/<name>`, the general bucket at `~/.agents/skills/<name>`, and nothing here lives in the repository you are working in -- a project's own `.agents/skills` is not a skill source for this server.
'''

# What introduces a folded handover note when a session replays one.
# Placeholders: {{summary}}
summary_preamble = '''
Earlier in this session, folded into this handover note by the agent itself:

{{summary}}'''

# The message that hands the folding decision to the agent when a request gets
# big. It names the numbers it is talking about and the two tools that act on
# them: a notice that says only "you are near the limit" leaves the reader to
# guess what is possible.
# Placeholders: {{session}}, {{tokens}}, {{budget}}, {{folded}}
context_notice = '''
Context notice for `{{session}}`: the last request carried {{tokens}} input tokens, and this session's threshold is {{budget}}. This server does not compact for you -- the shape of the context is your decision.

Right now {{folded}}.

Either way, write the handover note first -- it is all the later you will have. Start by reading what is actually being sent:

$GONGGA_HOME/skills/heir/transcript read --session {{session}}

Then choose by how much you still need the rows themselves.

Fold the older part, keeping every row in the database and readable again later:

$GONGGA_HOME/skills/heir/transcript collapse --session {{session}} --upto <seq> \
    --summary '<what was asked, what was tried, what worked and failed, the current state, the constraints that must survive>'

Or hand the whole transcript to a mentor session and empty this one -- the copy is verified row by row before anything is deleted, and what you wake up to is the note plus a line saying where your past went:

$GONGGA_HOME/skills/heir/transcript heir --session {{session}} --mentor <name> --summary '<the same note>'

An emptied session is clean, not broken: read the mentor with `get_messages`, ask it with `send_message`. If the work is nearly done, or the context is fine as it is, do nothing. `$GONGGA_HOME/skills/heir/SKILL.md` has the full procedure.'''

# The two states `{{folded}}` can carry inside `context_notice`.
# Placeholders: none
folded_none = '''
nothing has been folded yet'''

# Placeholder: {{upto}}
folded_through = '''
everything through seq {{upto}} is already folded into the summary'''

# What the agent is told about a tool call that never returned: verify, do not
# assume. Static.
interrupted_call = '''
No result was recorded: the turn was interrupted before this call returned. Its outcome is unknown -- re-check before relying on it.'''

# The one instruction a provider's size refusal leaves out: how to make it fit.
# Placeholders: {{message}}
size_hint = '''
{{message}}

The transcript no longer fits this model. Fold it, then send again: `$GONGGA_HOME/skills/heir/transcript collapse --session <name> --upto <seq>` -- or hand the whole thing to a mentor and start clean: `... heir --session <name> --mentor <name> --summary '<note>'`. See `$GONGGA_HOME/skills/heir/SKILL.md`.'''

# Why an image cannot be sent to this model, in the roster's own words.
# Placeholders: {{model}}, {{modalities}}
image_refusal = '''
this model cannot look at images: the roster lists modalities = [{{modalities}}] for {{model}}, with no "image" in it. Use a model whose roster entry includes "image" (set_session --llm <provider>/<model>), or leave the image out.'''

# Spliced into capped tool output where the middle was cut, naming the file the
# whole thing was written to. Placeholders: {{omitted}}, {{total}}, {{path}}
# The value opens with the two line breaks the model sees: TOML trims only the
# newline right after the delimiter, so two empty lines stay in the text.
output_cap = '''


[... {{omitted}} characters omitted ...]
full output ({{total}} characters) written to {{path}}
read just the part you need: `sed -n 'START,ENDp' {{path}}` or `grep -n PATTERN {{path}}` -- do not cat the whole thing again'''

# The same cut when nothing could be spilled to disk. Placeholder: {{omitted}}
output_omitted = '''


[... {{omitted}} characters omitted ...]'''
