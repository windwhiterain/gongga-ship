# gongga server configuration -- the shipped default.
#
# Installed by the harness into a home from the pinned ship commit, and merged
# with whatever the reader edited there: this file is copied as it is, so no
# placeholder is filled in on the way. The connection key lives beside it in
# `server.key`, never here, which is what lets this file be a merge target.
#
# Every value can be overridden by a GONGGA_* environment variable, and a value
# left out falls back to the same default the loader uses.

[server]
bind = "127.0.0.1:9700"
# The database is `<home>/gongga.db` and there is no key for it: a home that could
# name its database elsewhere could also name somebody else's.

[model]
# Which model to talk to. These are left commented out on purpose:
# the roster at ~/.agents/gongga-agents/providers.toml already says what this
# machine can reach, and the first entry that works is a better default than a
# name frozen into this file. Uncomment to override it.
# `model_name` is the name the provider's API takes; `provider` is whose it
# is, and may be left out when only one provider carries that name.
# model_name = ""
# provider = "deepseek-official"
# base_url = ""
# api_key_env = ""
# Capabilities are NOT configured here: they belong to the model, so they come
# from its entry in the roster (~/.agents/gongga-agents/providers.toml):
#
#   [[provider.model]]
#   id = "some-model"
#   # What it takes in and gives back. A list without "image" makes
#   # an attachment be refused by this entry's name instead of letting the
#   # provider answer with an opaque 400. Omit the list and nothing is
#   # refused: unstated is not a no.
#   modalities = ["text", "image"]
#   # Tools the provider runs on its own side, spelled the way that
#   # provider spells them -- "web_search", "web_search_preview",
#   # "web_fetch", ... Sent verbatim, so no mapping table is needed.
#   # Omit it and none are offered: offering one a provider does not
#   # know fails every request of every turn.
#   builtin_tools = ["web_search"]
store = false
# `cache_affinity` is not set here: whether a request may carry `prompt_cache_key` is a
# fact about the provider, so it lives in the roster's `[[provider]]` entry. LongCat
# states it (measured: 0/5 cached without the key, 5/5 with it); MiniMax's pages
# document no such field, so nothing is sent there. Setting it here overrides every
# provider for this home, which is exactly what the roster entry avoids.
# A request that never answers used to park a turn forever. Two
# timers bound it, each knowing what it bounds: the answer's
# headers must arrive within this long, and the model may not go
# this long without saying anything -- keep-alive chunks carry no
# event and do not count. Nothing bounds the body's total time: a
# long answer is allowed to take as long as it takes.
headers_timeout_ms = 180000
idle_timeout_ms = 60000
# Retries after a failure, a timeout, or a response with nothing in
# it. 0 = no ceiling: retry until the turn is cancelled. The delay
# doubles each time up to 30s: 1000ms, then twice that.
max_retries = 0
retry_base_ms = 1000

[tools.bash]
timeout_ms = 120000
# Output longer than this is capped: head and tail come back, the
# whole thing lands in ~/.gongga/outputs/. 0 disables the cap.
max_output_chars = 8000

[scripts]
# Commands a Python script registers with this server, without a Rust
# change: every *.py here is asked for its manifest, and what it
# declares appears in the catalog like any other command.
# dir = "scripts"
# Interpreter. Commented out: one that answers `-V` is detected.
# program = "/usr/bin/python3"

[agent]
# No step limit: a turn runs until the work is done.
# This server does not shorten the transcript for you. When a request carries
# more than this many input tokens, it injects one message telling the
# agent so, and the agent acts with the script the `heir` skill ships:
# hand the whole transcript to a mentor session and empty itself.
# 0 disables the
# notice. Only used when the model's context window is not in the
# roster; otherwise the threshold is a share of the window.
compress_above_tokens = 40000

# How often a prefix the provider once held is assumed to be gone by the next
# request, `0.0` to `1.0`. It is what turns the roster's rates into what a warm
# item is *expected* to be worth: at `0.2`, a cached token is worth 80% of the
# discount the roster advertises. A hyperparameter, not a measurement -- raise it
# for a provider whose cache is short-lived, and the plan starts preferring what
# it is sure of over what it hopes is still there.
cache_invalid_rate = 0.0

# A lifetime for a cached prefix, in seconds, for a machine that wants one number for
# every provider. `0` is no opinion rather than "never": the roster's own
# `cache_ttl_secs` for the provider is what the plan uses then, and a provider that
# states none either is the one left never expiring. A lifetime in force is enforced:
# each chain records when it was last sent, and a chain whose front is older than this
# is dropped before the next plan, so a provider that has certainly forgotten is not
# planned for as though it had not.
cache_ttl_secs = 0

[transport]
mtu = 1200
window = 64

# ---------------------------------------------------------------- prompts
#
# Every word this server hands a model as prose -- the system instructions and
# the few notes it injects -- lives here. Nothing in the binary composes those
# sentences: they are read from the home's `config.toml` when one exists and from
# this file otherwise.
#
# The notices below are string templates: `{{name}}` is filled with what the call
# site knows, and a placeholder the server does not supply is left exactly as
# written, so a typo shows up in what the model reads instead of silently deleting
# a sentence. The names each one gets are listed above it. The system instructions
# are not a template: they are read as written.
#
# These are re-read when a prompt row is written -- the turn's first step, or
# one whose index changed -- and the text rendered then is stored in that row
# and sent from it, so an edit lands at a boundary rather than at every step. Prose sits in front of the whole transcript in the provider's
# cached prefix: re-rendering per step re-bills the history behind it once per
# edit, and storing the render says what the model was actually told.
#
# What a template can never do is rewrite history: the rows of a session
# already under way are replayed as stored. Changing what a session remembers
# is the agent's own act, from a shell -- handing the transcript to a mentor
# and clearing itself with `heir`.
[prompts]

# The system instructions, sent as `instructions` on every request. No
# placeholder, and the server fills none: these bytes open every request, so a value
# here would end the prefix a provider already holds -- and two sessions of one
# directory would send two different heads, which is the whole first turn of every
# new session gone. A fact that differs between sessions belongs in the card
# (`dynamic_tail`), which the request carries after these instructions. A
# placeholder written here is left as written: `$GONGGA_SESSION` was read back by a
# model as a literal, so a sentence that needs the name is dropped rather than
# filled -- the card states it. The cache to protect is the provider's: a byte prefix
# at one endpoint, shared by every request that sends it, so one directory's sessions
# warm each other's first turn. `prefix_layout` (one row per session) is this server's
# plan for the order of the index, not that cache -- see
# docs/notes/server-prefix-cache.md. Everything a procedure can teach lives in a skill
# rather than here.
instructions = '''
You are a coding agent running on the user's machine, in a session of the gongga harness. `gongga-cli` is the command layer for this server.

The user has already authorised running commands: do not ask for confirmation, and leave nothing behind.

Every procedure this server does not encode as a tool is a skill: ask `skill` for the table, and read a body only when its line matches the task.
'''

# What the agent is told when a request gets big: begin training immediately;
# unfinished work and a dirty tree are current state, not prerequisites to fix.
# Placeholders: {{session}}, {{tokens}}, {{budget}}
context_notice = '''
Context notice for `{{session}}`: {{tokens}} input tokens against a threshold of {{budget}}. Start training your heir now. The heir continues the current work; do not finish the task, commit, clean the tree, or make the tests pass first.

A mentor is a session that keeps this transcript and can answer later questions. Your `--note` is the heir's first lesson: the current objective, what was tried, what worked or failed, the current state, and the next action.

Name in that lesson whatever the heir will need to read, as `@file(<path>)` or `@skill(<name>)` -- the session is empty, so the lesson is its first user message, and a reference written there is text the index carries once instead of a file read again every turn. The parentheses are the delimitation: the value ends at its own `)`, so prose, spaces and Chinese punctuation after it are just prose. A group left unclosed is not a reference at all, and it says nothing when it fails. `@skill(prefix-cache)` says the rest.

Ask `skill` for `heir`; `<heir>` below is the path it prints. Then run this command now:

<heir>/transcript heir --note '<objective, tried, worked, failed, current state, next action>'

Uncommitted changes and failing tests are valid state: record them instead of fixing them first. Every request made before the heir starts is paid for at this size.'''

# What the agent is told about a tool call that never returned: verify, do not
# assume. Static.
interrupted_call = '''
No result was recorded: the turn was interrupted before this call returned. Its outcome is unknown -- re-check before relying on it.'''

# The one instruction a provider's size refusal leaves out: how to make it fit.
# Placeholders: {{message}}
size_hint = '''
{{message}}

The transcript no longer fits this model. Start training an heir now with `heir`'s `transcript heir` (`skill` prints its path). The heir continues the current work; no commit, clean tree, or green suite is required first.'''

# What opens the input: the facts of this session, one message, before the first user
# message. Stamped once, so the bytes are replayed rather than re-rendered.
# Placeholders: {{session}}, {{build}}, {{now}}, {{cwd}}
dynamic_tail = '''
Session `{{session}}`, harness gongga at `{{build}}`, {{now}}, in `{{cwd}}`.'''

# The same card when the workspace is not on this machine. It is a second template
# rather than a clause in the one above because a template has no conditional, and
# because a session on this machine keeps the bytes it has already sent.
# Occupies: {{session}}, {{build}}, {{now}}, {{cwd}}, {{remote}}
dynamic_tail_remote = '''
Session `{{session}}`, harness gongga at `{{build}}`, {{now}}, in `{{cwd}}` -- a directory on remote `{{remote}}`, not on the machine this server runs on. `remote_bash` is that machine's shell; `bash` is this one's. The harness itself stays here: `remote_bash` has no `gongga-cli`, and `read_file`, `write_file`, `replace` and `python` act on this machine -- a relative path in them names this machine's copy of the session's directory, never the peer's. Read and edit that machine's files with `remote_bash`.'''

# The same, when no directory was named for the session and the peer's shell has not
# reported one yet. The first card is the one a session keeps, so it may not say
# "in ``": naming no directory is the documented default, not a mistake.
# Occupies: {{session}}, {{build}}, {{now}}, {{remote}}
dynamic_tail_remote_unstated = '''
Session `{{session}}`, harness gongga at `{{build}}`, {{now}}, working on remote `{{remote}}` -- not on the machine this server runs on. No directory was named there, so that machine's shell starts where that machine starts. `remote_bash` is that machine's shell; `bash` is this one's. The harness itself stays here: `remote_bash` has no `gongga-cli`, and `read_file`, `write_file`, `replace` and `python` act on this machine, never on the peer. Read and edit that machine's files with `remote_bash`.'''

# What introduces the index of the references the first message named, and of the
# `AGENTS.md` the session's own directory keeps: their text, each after the spelling
# that names it, which the message then leaves as written.
# Placeholder: {{entries}}
reference_index = '''
The text of every reference named in this conversation, and of the `AGENTS.md` this session's directory carries. A line that is only a reference is followed by the text it stands for.

{{entries}}'''

# What opens the request, before the index. A provider's first message is an
# all-or-nothing unit -- one byte that differs in it costs the system text and the tool
# schemas too -- so this is a constant, and the index begins after it. See
# docs/reference/prefix-cache.md.
index_opening = '''
The index of this directory's rules and references follows.'''

# The message that keeps the opening and the index from merging into one: two user
# messages in a row are merged, and the index would be back in the first message. A
# message of the other role separates them.
index_separator = '''
Understood.'''

# What catches up an entry above that has changed since it was sent. The index keeps
# the text the provider already cached, so what changed is said once, at the end,
# instead of re-sending the entry and everything planned after it.
# Placeholder: {{revisions}}
reference_revision = '''
An entry above is out of date when a block below names it: the block replaces the lines it removes (`-`) with the lines it adds (`+`), keeping three unchanged lines around each change, counted from the start of that entry's text. Read the entry and its block together. A line a block does not mention still reads as the entry says, and the entry's text is not otherwise rewritten.

{{revisions}}'''

# Why an image cannot be sent to this model, in the roster's own words.
# Placeholders: {{model}}, {{modalities}}
image_refusal = '''
this model cannot look at images: the roster lists modalities = [{{modalities}}] for {{model}}, with no "image" in it. Use a model whose roster entry includes "image" (set_session --model <provider>/<model name>), or leave the image out.'''

# Spliced into capped tool output where the middle was cut, naming the file the
# whole thing was written to. Placeholders: {{omitted}}, {{total}}, {{path}}
# The value opens with the two line breaks the model sees: TOML trims only the
# newline right after the delimiter, so two empty lines stay in the text.
output_cap = '''


[... {{omitted}} characters omitted ...]
full output ({{total}} characters) written to {{path}}
read just the part you need: `sed -n 'START,ENDp' {{path}}` or `grep -n PATTERN {{path}}` -- do not cat the whole thing again'''

# The same cut when nothing could be spilled to disk. Placeholder: {{omitted}}
output_omitted = '''


[... {{omitted}} characters omitted ...]'''

# What the server hands a monitor session when a turn of another session ended in an
# error. The facts vary; every rule the monitor works under is here, because a report
# that leaves them out is a report whose reader invents them.
#
# Placeholders: {{session}}, {{model}}, {{rows}}, {{build}}, {{home}}, {{pid}},
# {{cwd}}, {{mine}}, and {{noted}} -- the server's own last note for that session, or
# nothing at all.
monitor_error = '''
@skill(monitor)

A gongga session stopped with an error. Find the cause and fix it; the skill says how to tell a provider's refusal from a harness bug, and where the truth is on this machine.

- session: {{session}}
- its model: {{model}}
- its rows: {{rows}}
- harness build: {{build}}
- home: {{home}}
- server: pid {{pid}}, cwd {{cwd}}
- this turn runs on: {{mine}}
{{noted}}
Read it back with:

    gongga-cli get_messages --session {{session}} -40:-1

Your authorization is this session's error and nothing else: find the cause and fix it. A session whose model cannot run may be moved to another model of the same tier -- the tier is the setup's choice, never yours, so do not change it -- and nothing else about the session, its records or the file tree is yours to change. When that tier has nothing able to run, say so and stop instead of reaching for another one. If it is a harness bug, `@skill(self-control)` says how to restart the server without losing a turn. Report what you found and what you changed in one message.'''

# The same report, handed to the next model after the monitor itself failed: what it
# was given, unchanged. Re-deriving it would lose what the first attempt was told.
#
# Placeholders: {{model}}, {{failure}}, {{again}}
monitor_error_again = '''
The monitor failed on {{model}}. This is the report it was given, unchanged; the failure is in this conversation.

What the server recorded for that turn:

{{failure}}

---

{{again}}'''

# What the server hands a cleaner session when a disk is under the floor this machine
# declared. Nothing has failed yet, so the report says what is full, not what broke.
#
# Placeholders: {{skills}}, {{machine}}, {{home}}, {{volumes}}, {{threshold}}, {{tool}},
# {{session}}, {{ok}}, {{cwd}}, {{build}}, {{pid}}, {{server_cwd}}, {{read_back}} and
# {{reach}}, each of the last two empty when it does not apply.
monitor_disk = '''
{{skills}}

A gongga server has less disk room left on {{machine}} than this machine declared it must have. Nothing has failed yet; find what is filling the disk, clean it with the skill, and say what you freed.

- home: {{home}}
- the machine that is low: {{machine}}
- volumes as they stood then:
{{volumes}}
- the threshold this machine declared: {{threshold}}
- the tool that was running: {{tool}} (in session {{session}}, {{ok}})
- its directory: {{cwd}}
- harness build: {{build}}
- server: pid {{pid}}, cwd {{server_cwd}}
{{read_back}}{{reach}}
The skill surveys every volume first and reports what it freed per volume; start there. This server said this once for the whole time the disk stays this low: answer in one message with what was full, what you freed, and what is left.'''

# ---------------------------------------------------------------- tool words
#
# What each tool says it is, and what each of its arguments is for. The code holds
# a default for every one of them; a line here replaces it, so a wording change is
# an edit to this file and not a build.
#
#   [tool_text.remote_bash]
#   description = '''`bash` on the session's remote endpoint ...'''
#
# `[tool_text.general.arguments]` is the tunnel's own words, and a tool that words
# none of them for itself takes the sentence from there.
#
# Only sentences live here: nothing can add, remove or retype an argument, because
# the shape of a schema is what the tool reads. A name no tool of that name declares
# is ignored, and said at startup. The section is `tool_text` and not `tools`, which
# is a tool's runtime settings (`[tools.bash]` above) and must not be read as prose.

[tool_text.general.arguments]
background = '''Do not wait for this call: it runs as a process of its own, which outlives a `cancel` and is picked up again when the server restarts. The call returns at once; the answer arrives later as a notice for this session and `check_job` collects it. Only `cancel` lets it go: a signal, a window closing or a killed server ends every job with it. A tool that acts on the server's own state -- its shells, its interpreters, its jobs -- cannot be a process of its own and refuses `background`: call it in the foreground instead. `remote_bash` and `python` are the exception: their background is a job of that shell or interpreter, which `check_bash` and `check_python` read. Defaults to false.'''
max_output = '''In chars: when the output exceeds this, it is saved to a temp file and the call answers with the file's metadata {path, chars, line_count}.'''
timeout_ms = '''How long this call may hold the turn. Past it the call neither fails nor stops the work: it answers at once with the id of the `background` job that the work became, and `check_job` collects what it answered. `bash` and `python` turn a long wait into their own background job instead, which `check_bash` and `check_python` read. No call holds a turn longer than this machine's ceiling, however long it asks for.'''

[tool_text.bash]
description = '''Run a shell command in a persistent Git Bash on this machine -- the one the server runs on. Each `name` is a separate shell that keeps its own working directory, exports and shell functions between calls, and stays alive until you `del_bash` it; omit `name` to use `default`. So reusing one name is how state accumulates -- inventing a name per command leaves one idle process behind per command. A name is one shell: a name already held is refused rather than quietly becoming a second process. Output is streamed as it is produced. Use `cd` to move around instead of passing absolute paths every time. Very long output is capped: you get the beginning and the end, and the full text is written to a file named in the result -- read that file with `sed -n` or `grep`, do not cat it. With `background`, the command is started as a process of its own and the call returns immediately; collect what it answered later with `check_job`.'''

[tool_text.bash.arguments]
background = '''Start the command as a process of its own and return immediately. Only `cancel` lets it go: it then outlives the server and is adopted on restart, while any other stop ends it with the server. `check_job` collects what it answered, and this session is told when it ends. Defaults to false.'''
command = '''The command line to execute. A program and its arguments, where an argument holds a space or a quote, belong in `exec`: there the words are not read by a shell and need no escaping.'''
description = '''What this call is for, in a few words -- it is read right after the tool's name, so say what the run is for, not what the command is (`check the state`, not `bash`). Optional, and never executed: it also names the file that a too-long output is spilled to, so that later you (and whoever reads the dumps) can tell one run from another. Example: `run the server tests`.'''
name = '''Which persistent shell to run in, default `default` -- reusing a name is what carries `cd`, exports and shell functions from one call to the next.'''
timeout_ms = '''How long to wait for the command before returning. This is a limit on waiting, not on the command: when it passes, the command keeps running in the background and its output is posted to this session when it finishes. Ignored for background commands.'''

[tool_text.remote_bash]
description = '''`bash` on the session's remote endpoint -- the peer that holds this session's directory. Same `command`, `name`, `description`, `timeout_ms` and `background` as `bash`; the paths are that machine's.'''

[tool_text.remote_bash.arguments]
background = '''Start the command and return immediately instead of waiting for it. Collect what it printed with `check_bash`, and this session is told when it ends. This one is a job of that shell, not a process of its own, so it ends with the server. Defaults to false.'''
command = '''The command line to execute. A program and its arguments, where an argument holds a space or a quote, belong in `exec`: there the words are not read by a shell and need no escaping.'''
description = '''What this call is for, in a few words -- it is read right after the tool's name, so say what the run is for, not what the command is (`check the state`, not `bash`). Optional, and never executed: it also names the file that a too-long output is spilled to, so that later you (and whoever reads the dumps) can tell one run from another. Example: `run the server tests`.'''
name = '''Which shell to run in on the machine this session's directory is on, default `default`. Reusing a name is what carries `cd`, exports and shell functions from one call to the next; a name `bash` already holds is refused rather than becoming a second shell.'''
target = '''Which machine to run on. Omit it: this call runs on the session's remote whatever this names.'''
timeout_ms = '''How long to wait for the command before returning. This is a limit on waiting, not on the command: when it passes, the command keeps running in the background and its output is posted to this session when it finishes. Ignored for background commands.'''

[tool_text.exec]
description = '''Run one program with its arguments, without a shell. The command is a list of words: the program first, then its arguments, one word each. No shell reads them, so a word that holds a space, a quote, a `;` or a `$` reaches the program exactly as written -- there is nothing to escape and nothing to escape it wrongly. What a shell would do (pipes, redirects, `cd`, `&&`, variable expansion, wildcards) is not available here; use `bash` for those. The program is looked up on PATH, and it runs in the session's directory. This is not the persistent shell: `cd` and exports do not survive the call.'''

[tool_text.exec.arguments]
command = '''The program and its arguments, one word each: the program first. No word is interpreted, so a word that holds a space, a quote, a `;` or a `$` needs no escaping and gets none.'''
description = '''What this call is for, in a few words -- it is read right after the tool's name, so say what the run is for, not what the command is (`check the state`, not `exec`). Optional, and never executed: it also names the file that a too-long output is spilled to, so that later you (and whoever reads the dumps) can tell one run from another.'''

[tool_text.remote_exec]
description = '''`exec` on the session's remote endpoint -- one program with its arguments, with no shell between them, looked up on the peer's PATH. Same `command` as `exec`; the paths are that machine's.'''

[tool_text.remote_exec.arguments]
command = '''The program and its arguments, one word each: the program first. No word is interpreted, so a word that holds a space, a quote, a `;` or a `$` needs no escaping and gets none.'''
description = '''What this call is for, in a few words -- it is read right after the tool's name, so say what the run is for, not what the command is (`check the state`, not `exec`). Optional, and never executed: it also names the file that a too-long output is spilled to, so that later you (and whoever reads the dumps) can tell one run from another.'''

[tool_text.check_bash]
description = '''What a shell printed that you have not read: everything its `background` commands wrote, plus anything it printed while nobody was reading. Reading clears it, so each chunk comes back once. Empty means nothing yet -- ask again, or set `wait_ms` to wait for the running jobs.'''

[tool_text.check_bash.arguments]
description = '''What this call is for, in a few words: the log carries it as the call's title.'''
name = '''Shell to read. Defaults to `default`.'''
wait_ms = '''If this shell has background jobs, wait up to this many milliseconds for them to finish before reading. Passing it returns the output so far and leaves the jobs running; it never stops them. Defaults to 0, which reads now.'''

[tool_text.check_job]
description = '''What became of a call that did not wait for its answer: a `background` call, which answers at once with a `job_id`, and whose output waits here because nothing else collects it. The status is `running`, `ok`, `error` or `lost`, and `lost` means the server stopped before the job finished, so nothing can say what it printed. Reading an answer clears it, so it comes back once; a job that has not ended is not stopped by being asked about.'''

[tool_text.check_job.arguments]
description = '''What this call is for, in a few words: the log carries it as the call's title.'''
job_id = '''The id the `background` call answered with. A job belongs to the session that started it.'''
wait_ms = '''If the job is still running, wait up to this many milliseconds for it to end before answering. Passing it answers `running` and leaves the job going; it never stops it. Defaults to 0, which answers now.'''

[tool_text.wait]
description = '''Stay in this turn until something arrives for this session: the report of a background job that finished, the news of a `subscribe` whose pattern matched, or a message from a person. It consumes nothing -- whatever arrived is delivered at the next step boundary, the same way every other queued message is -- so this call is how an agent waits without giving up its turn, and without polling. With no `timeout_ms` it waits for the same ceiling a `bash` call gets; when that passes it says nothing arrived, which is not an error.'''

[tool_text.wait.arguments]
timeout_ms = '''Give up after this many milliseconds. This is a limit on waiting, not on the news: passing it returns what has not arrived, and nothing is lost.'''

[tool_text.del_bash]
description = '''Delete bash whose name matches a regex. A persistent shell is discarded: its working directories, exports and shell functions are lost, and naming it again starts a fresh shell in its own session directory; the background jobs it was running go with it. A name is one shell, so this ends it wherever it lives. Use this when a shell is wedged or polluted, and to clean up the names a long session invented.'''

[tool_text.del_bash.arguments]
description = '''What this call is for, in a few words: the log carries it as the call's title.'''
name_regex = '''Pattern matched against shell names, unanchored: `qa` also takes `qa2`. Defaults to `^default$`.'''

[tool_text.del_job]
description = '''Delete a job by its id. A job still running is stopped: the work ends where it is, and what it had printed is not kept. A job that had already ended is only forgotten. Nothing about a deleted job is posted to this session afterwards, so this drops a job whose answer is no longer wanted as well as one that has to stop.'''

[tool_text.del_job.arguments]
description = '''What this call is for, in a few words: the log carries it as the call's title.'''
job_id = '''The id the `background` call answered with, or the one a call became when it outlived its clock. A job belongs to the session that started it.'''

[tool_text.list_bash]
description = '''List the bash of this session: their names, their working directories, how much unread output they are holding, and how many background jobs are still running. `name_regex` narrows the answer to the names that match, which is how one name's state is asked about.'''

[tool_text.list_bash.arguments]
description = '''What this call is for, in a few words: the log carries it as the call's title.'''
