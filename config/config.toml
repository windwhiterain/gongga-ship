[tool_text.read_file]
description = '''Read a UTF-8 file through the Python tool's interpreter. `offset` and `limit` are lines, zero-based; `limit = 0` reads to the end. The content is a tool result, so it never passes through shell quoting. Use it instead of `cat` when the file's bytes matter.'''

[tool_text.read_file.arguments]
description = '''What this call is for, in a few words -- read after the tool name, never executed.'''
limit = '''How many lines; 0 means to the end. Defaults to 0.'''
offset = '''First line, zero-based. Defaults to 0.'''
path = '''File to read.'''
remote = '''Which machine the file is on. Omit it for this machine; name the session's remote for that machine's file instead.'''

[tool_text.write_file]
description = '''Write a file through the Python tool's interpreter: `content` is a JSON field, so it is written exactly as given, with no shell or Python quoting layer. Missing parent directories are created and the replacement is atomic. Use this instead of a heredoc or `write_text` inside a `python` program.'''

[tool_text.write_file.arguments]
content = '''The complete UTF-8 content; this is the file, not a program.'''
description = '''What this call is for, in a few words -- read after the tool name, never executed.'''
path = '''File to write.'''
remote = '''Which machine the file is on. Omit it for this machine; name the session's remote for that machine's file instead.'''

[tool_text.replace]
description = '''Replace one exact, literal piece of a UTF-8 file through the Python tool's interpreter. Without `all`, `old` must occur exactly once; any other count is an error, so a stale context cannot silently rewrite the wrong place. With `all`, every occurrence is replaced. The write is atomic. `old` and `new` are JSON fields, not shell or Python syntax.'''

[tool_text.replace.arguments]
all = '''Replace every occurrence instead of requiring exactly one. Defaults to false.'''
description = '''What this call is for, in a few words -- read after the tool name, never executed.'''
new = '''Replacement text.'''
old = '''Exact text to replace.'''
path = '''File to edit.'''
remote = '''Which machine the file is on. Omit it for this machine; name the session's remote for that machine's file instead.'''

[tool_text.skill]
description = """Run the entry a skill declares, or list what is installed.

With no `name`: one row per skill this session can open -- what to call it, the line saying what it is for, the `SKILL.md` to read, and which root it came from (`project` for this checkout, `harness` for the home, `general` for the machine, in that precedence).

With `name`: that skill's entry, started with your `args` and nothing between them -- no shell, so a word holding a space, a quote or a `$` arrives as it is. A skill that is a Python package publishes *functions*: the first word of `args` names which one, and the rest bind to its parameters in order (`--name value` spells one out). A script entry's program is read off its extension and its `#!` line: give the script's arguments, never its interpreter. The entry's own output comes back and its exit code is this call's `ok`, so a non-zero one is the skill failing, not this tool. A skill that is a body with no entry refuses, naming the `SKILL.md` to read instead, and a name installed in two roots refuses rather than picking one.

It runs on this machine in the session's directory, whatever machine the session works on: an entry is a file this server can open. Use `exec` when the program is yours to name; use this when the skill owns it."""

[tool_text.skill.arguments]
args = '''The entry's arguments, one word each: passed through unparsed and unquoted, so a word holding a space or a `$` needs no escaping and gets none.'''
description = '''What this call is for, in a few words: the log carries it as the call's title.'''
name = '''The skill's name, as a row of the list spells it. Omit it and this answers with the list instead.'''
