# What this content is, and how it lands in a harness home.
#
# A server installs the newest commit of this repository that speaks the protocol
# it was built to read, and this file is how that commit describes itself. So the
# mapping below travels with the content it maps: changing where a skill lives, or
# naming a path this repository stopped shipping, is an edit here and a push --
# never an edit to the harness and never a rebuild.
#
# `protocol` itself is the exception: raise it only when the shape below changes in
# a way an older server cannot read (a new required key, a different layout). Cut
# over one protocol at a time: raise it here, ship the harness that reads it, and
# let the last commit of the old protocol serve the machines that have not
# upgraded yet -- they keep getting it, because a server walks back through the
# first-parent history until it finds the protocol it reads.
#
# 4: the start card names `{{model}}`, a placeholder a protocol-3 server does not
# fill -- it would install this config and print the braces into every new session's
# card. Walking back is what keeps that machine on the 3 card it can read.
#
# 9: the command line spells SPEC's argument names (`--id`, `--session`, `--path`),
# and a protocol-8 server reads the old ones -- so the skills that name a flag are
# content this build cannot share with one that has not moved.
# 10: live_compact's checkpoint is two parts, `settled` (required) and `next` --
# a protocol-9 server reads a single `summary` and cannot store this shape.
# 11: a tool row no longer declares the tunnel's arguments (`tunneled`, `carrier`,
# `timeout_ms`, `owns_its_wait`, `handles_background`) or `[tools.arguments]`: the
# call layer stopped offering them, so a protocol-10 server cannot read these rows.
# 12: the Python surface moved out of the harness and into this repository. `python`
# names the directory that becomes a home's `lib`, and a protocol-11 server reads only
# `config` and `skills`: it would install these skills into a home whose
# `lib/gongga_skill.py` it never writes, and every package skill there is one that
# cannot start.
protocol = 12

# Which path in this repository is the home's config.
config = "config/config.toml"

# Where this repository keeps the harness's Python surface. The directory lands in the
# home's `lib` whole: `gongga_skill.py` is the contract a package skill is run through,
# `gongga.py` the client a skill's own Python imports, and `gongga_cli.py` what this
# home's `bin/gongga-cli` starts. Same kind of mapping as a skill's, so it is reconciled
# against the same base: a file this commit stops shipping is one the install removes.
python = "python"

# The skills this repository owns, flat: one directory per skill, and the home's
# `skills/<name>` is the same name. The machine's skills are not here -- they are
# the community clone's (`agents::link_skills`), which is where a machine's skills
# are edited without any content movement.
[skills]
harness = "skills"

# What an earlier commit installed on the machine and this one does not. The path
# is gone from the repository, so nothing lands there any more; naming it is what
# lets the install recognise the copies it left and remove them, instead of
# letting them shadow the community skill of the same name forever.
[[skills.retired]]
path = "skills/general"
root = "machine"
